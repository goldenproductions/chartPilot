{{- if .Values.certificate.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "member-api.fullname" . }}-tls
  labels:
    {{- include "member-api.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.certificate.secretName }}
  # Short lifetime, renewed well before expiry — the platform golden path asks for under 90 days.
  duration: {{ .Values.certificate.duration }}
  renewBefore: {{ .Values.certificate.renewBefore }}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - server auth
    - digital signature
    - key encipherment
  commonName: {{ index .Values.certificate.dnsNames 0 | quote }}
  dnsNames:
    {{- toYaml .Values.certificate.dnsNames | nindent 4 }}
  issuerRef:
    name: {{ .Values.certificate.issuer.name }}
    kind: {{ .Values.certificate.issuer.kind }}
    group: cert-manager.io
{{- end }}
