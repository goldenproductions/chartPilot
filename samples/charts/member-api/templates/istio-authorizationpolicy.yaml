{{- if and .Values.istio.enabled .Values.istio.authorizationPolicy.enabled }}
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ include "member-api.fullname" . }}
  labels:
    {{- include "member-api.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "member-api.selectorLabels" . | nindent 6 }}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              {{- toYaml .Values.istio.authorizationPolicy.principals | nindent 14 }}
      to:
        - operation:
            methods:
              - GET
              - POST
              - PUT
            paths:
              - /api/members/*
{{- end }}
