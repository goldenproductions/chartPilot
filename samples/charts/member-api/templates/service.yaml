apiVersion: v1
kind: Service
metadata:
  name: {{ include "member-api.fullname" . }}
  labels:
    {{- include "member-api.labels" . | nindent 4 }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: {{ .Values.service.metricsPort | quote }}
    prometheus.io/path: {{ .Values.serviceMonitor.path | quote }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "member-api.selectorLabels" . | nindent 4 }}
