apiVersion: v1
kind: Secret
metadata:
  name: {{ include "insecure-member-api.fullname" . }}-db
  labels:
    {{- include "insecure-member-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  # A password checked into git and rendered into the manifest stream.
  password: {{ .Values.database.password | quote }}
  connectionString: "Host={{ .Values.database.host }};Username={{ .Values.database.username }};Password={{ .Values.database.password }}"
