apiVersion: v1
kind: Service
metadata:
  name: legacy-importer
  labels:
    app: legacy-importer
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
  selector:
    app: legacy-importer
