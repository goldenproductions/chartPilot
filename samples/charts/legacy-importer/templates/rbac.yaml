{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: legacy-importer
  labels:
    app: legacy-importer
rules:
  - apiGroups:
      - "*"
    resources:
      - "*"
    verbs:
      - "*"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: legacy-importer
  labels:
    app: legacy-importer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: legacy-importer
subjects:
  - kind: ServiceAccount
    name: legacy-importer
    namespace: {{ .Release.Namespace }}
{{- end }}
