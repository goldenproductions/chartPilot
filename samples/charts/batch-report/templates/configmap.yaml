apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "batch-report.fullname" . }}
  labels:
    {{- include "batch-report.labels" . | nindent 4 }}
data:
  report.yaml: |
    format: {{ .Values.config.reportFormat }}
    outputBucket: {{ .Values.config.outputBucket }}
    lookbackDays: {{ .Values.config.lookbackDays }}
