---
# Source: member-api/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: member-api
  labels:
    app: member-api
---
# Source: member-api/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: member-api-config
  namespace: member-prod
data:
  LOG_LEVEL: info
---
# Source: member-api/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: member-api
spec:
  type: ClusterIP
  selector:
    app: member-api
  ports:
    - port: 80
      targetPort: http
---
# Source: member-api/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: member-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: member-api
  template:
    metadata:
      labels:
        app: member-api
    spec:
      serviceAccountName: member-api
      containers:
        - name: member-api
          image: ghcr.io/acme/member-api:1.4.2
