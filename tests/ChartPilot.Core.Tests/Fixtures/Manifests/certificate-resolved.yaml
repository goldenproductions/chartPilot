---
# Source: member-api/templates/issuer.yaml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
---
# Source: member-api/templates/tls-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: member-api-tls
type: kubernetes.io/tls
data:
  tls.crt: ""
  tls.key: ""
---
# Source: member-api/templates/certificate.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: member-api
spec:
  secretName: member-api-tls
  duration: 2160h
  renewBefore: 720h
  dnsNames:
    - members.acme.io
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
