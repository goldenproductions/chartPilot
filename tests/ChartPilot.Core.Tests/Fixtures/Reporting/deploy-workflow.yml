# Generated by ChartPilot.
name: Helm Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to validate and deploy
        required: true
        type: choice
        options:
          - dev
          - test
          - prod

jobs:
  validate:
    name: Validate chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Helm lint
        run: helm lint ./chart
      - name: Render manifests
        run: helm template member-api ./chart -f values-${{ inputs.environment }}.yaml
      - name: Run platform checks
        run: chartpilot check ./chart -f values-${{ inputs.environment }}.yaml --profile sensitive-member-data-service --fail-on critical

  deploy:
    name: Deploy
    needs: validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy with Helm
        run: |
          helm upgrade --install member-api ./chart \
            -f values-${{ inputs.environment }}.yaml \
            --namespace member-platform \
            --create-namespace
