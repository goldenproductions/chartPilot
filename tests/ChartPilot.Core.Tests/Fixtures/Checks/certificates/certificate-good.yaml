apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: member-api-tls
spec:
  secretName: member-api-tls
  duration: 2160h
  renewBefore: 720h
  dnsNames:
    - member-api.example.com
  issuerRef:
    name: letsencrypt-prod
    kind: Issuer
    group: cert-manager.io
---
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: public-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 443
        name: https
        protocol: HTTPS
      hosts:
        - member-api.example.com
      tls:
        mode: SIMPLE
        credentialName: member-api-tls
