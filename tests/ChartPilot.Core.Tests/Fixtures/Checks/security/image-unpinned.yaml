apiVersion: apps/v1
kind: Deployment
metadata:
  name: member-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: member-api
  template:
    metadata:
      labels:
        app: member-api
    spec:
      containers:
        - name: api
          image: ghcr.io/example/member-api:stable
