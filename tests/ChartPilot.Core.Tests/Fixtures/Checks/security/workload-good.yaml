apiVersion: v1
kind: ServiceAccount
metadata:
  name: member-api
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: member-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: member-api
  template:
    metadata:
      labels:
        app: member-api
    spec:
      serviceAccountName: member-api
      automountServiceAccountToken: false
      hostNetwork: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: ghcr.io/example/member-api:1.4.2
          securityContext:
            privileged: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: member-api-db
                  key: password
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: member-api
spec:
  podSelector:
    matchLabels:
      app: member-api
  policyTypes:
    - Ingress
    - Egress
