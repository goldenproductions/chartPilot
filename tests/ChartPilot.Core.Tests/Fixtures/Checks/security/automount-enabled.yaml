apiVersion: v1
kind: ServiceAccount
metadata:
  name: member-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: member-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: member-api
  template:
    metadata:
      labels:
        app: member-api
    spec:
      serviceAccountName: member-api
      automountServiceAccountToken: true
      containers:
        - name: api
          image: ghcr.io/example/member-api:1.4.2
