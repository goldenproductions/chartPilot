apiVersion: apps/v1
kind: Deployment
metadata:
  name: member-api
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: member-api
  template:
    metadata:
      labels:
        app: member-api
    spec:
      containers:
        - name: api
          image: ghcr.io/example/member-api:1.4.2
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: member-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: member-api
  minReplicas: 2
  maxReplicas: 6
