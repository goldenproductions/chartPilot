apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-export
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: nightly-export
        spec:
          restartPolicy: OnFailure
          containers:
            - name: export
              image: ghcr.io/example/exporter:1.0.0
