apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: public-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - member-api.example.com
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: member-api
spec:
  hosts:
    - member-api.example.com
  gateways:
    - public-gateway
  http:
    - route:
        - destination:
            host: member-api-typo
      timeout: 5s
      retries:
        attempts: 3
