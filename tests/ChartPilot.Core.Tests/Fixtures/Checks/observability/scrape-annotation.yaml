apiVersion: apps/v1
kind: Deployment
metadata:
  name: member-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: member-api
  template:
    metadata:
      labels:
        app: member-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      containers:
        - name: api
          image: ghcr.io/example/member-api:1.4.2
          ports:
            - name: metrics
              containerPort: 9090
