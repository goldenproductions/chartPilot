apiVersion: apps/v1
kind: Deployment
metadata:
  name: member-api
  labels:
    app.kubernetes.io/name: member-api
    app.kubernetes.io/instance: member-api
    app.kubernetes.io/version: "1.4.2"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: member-platform
  annotations:
    chartpilot.io/owner: team-member-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: member-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: member-api
    spec:
      containers:
        - name: api
          image: ghcr.io/example/member-api:1.4.2
          env:
            - name: LOG_LEVEL
              value: info
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability:4317
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
---
apiVersion: v1
kind: Service
metadata:
  name: member-api
  labels:
    app.kubernetes.io/name: member-api
    app.kubernetes.io/instance: member-api
    app.kubernetes.io/version: "1.4.2"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: member-platform
spec:
  selector:
    app.kubernetes.io/name: member-api
  ports:
    - name: metrics
      port: 9090
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: member-api
  labels:
    app.kubernetes.io/name: member-api
    app.kubernetes.io/instance: member-api
    app.kubernetes.io/version: "1.4.2"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: member-platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: member-api
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
